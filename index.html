<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idle Clicker Empire</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .game-container {
      background: #1e293b;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      width: 340px;
    }
    h1 { font-size: 54px; margin: 5px 0; color: #38bdf8; }
    .stat { color: #94a3b8; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .main-btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 50%;
      width: 150px;
      height: 150px;
      cursor: pointer;
      margin: 20px 0;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      transition: transform 0.1s, background 0.2s;
    }
    .main-btn:hover { background: #0369a1; }
    .main-btn:active { transform: scale(0.95); }
    .shop-box {
      margin-top: 20px;
      border-top: 2px solid #334155;
      padding-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .shop-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: #111827;
      padding: 10px;
      border-radius: 8px;
    }
    .upgrade-btn {
      background: #22c55e;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      text-align: left;
    }
    .upgrade-btn:hover { background: #16a34a; }
    .upgrade-btn:disabled { background: #475569; cursor: not-allowed; }
    .item-meta {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      width: 100%;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="stat">Total Score</div>
    <h1 id="scoreDisplay">0</h1>
    <div class="stat" id="gpsDisplay">+0 per second</div>
    <div class="stat" id="clickPowerDisplay" style="font-size: 11px; color: #38bdf8;">1 per click</div>

    <button class="main-btn" id="clickBtn">CLICK!</button>

    <div class="shop-box">
      <!-- UPGRADE 1: MANUAL CLICK POWER -->
      <div class="shop-item">
        <button class="upgrade-btn" id="buyClickUpgrade">
          Reinforced Mouse (Cost: 10)
        </button>
        <div class="item-meta">
          <span id="clickUpgradeCount">Level: 1</span>
          <span>+1 per click</span>
        </div>
      </div>

      <!-- UPGRADE 2: AUTO-CLICKER -->
      <div class="shop-item">
        <button class="upgrade-btn" id="buyAutoClicker">
          Cursor Bot (Cost: 15)
        </button>
        <div class="item-meta">
          <span id="autoClickerCount">Owned: 0</span>
          <span>+1/sec</span>
        </div>
      </div>

      <!-- UPGRADE 3: HIGH-TIER GRANDMA -->
      <div class="shop-item">
        <button class="upgrade-btn" id="buyGrandma">
          Grandma Baker (Cost: 100)
        </button>
        <div class="item-meta">
          <span id="grandmaCount">Owned: 0</span>
          <span>+8/sec</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- GAME STATE ---
    let score = 0;
    let clickPower = 1;
    let clickUpgradeCost = 10;
    let clickUpgradeLevel = 1;

    let autoClickers = 0;
    let autoClickerCost = 15;

    let grandmas = 0;
    let grandmaCost = 100;

    // --- DOM ELEMENTS ---
    const scoreDisplay = document.getElementById('scoreDisplay');
    const gpsDisplay = document.getElementById('gpsDisplay');
    const clickPowerDisplay = document.getElementById('clickPowerDisplay');
    const clickBtn = document.getElementById('clickBtn');

    const buyClickBtn = document.getElementById('buyClickUpgrade');
    const clickCountDisplay = document.getElementById('clickUpgradeCount');

    const buyAutoBtn = document.getElementById('buyAutoClicker');
    const autoCountDisplay = document.getElementById('autoClickerCount');

    const buyGrandmaBtn = document.getElementById('buyGrandma');
    const grandmaCountDisplay = document.getElementById('grandmaCount');

    // --- UI UPDATER ---
    function updateUI() {
      // Global counters
      scoreDisplay.textContent = Math.floor(score);
      const totalGps = autoClickers + (grandmas * 8);
      gpsDisplay.textContent = `+${totalGps} per second`;
      clickPowerDisplay.textContent = `${clickPower} per click`;

      // Click Power Upgrade UI
      buyClickBtn.textContent = `Reinforced Mouse (Cost: ${clickUpgradeCost})`;
      clickCountDisplay.textContent = `Level: ${clickUpgradeLevel}`;
      buyClickBtn.disabled = score < clickUpgradeCost;

      // Auto-Clicker UI
      buyAutoBtn.textContent = `Cursor Bot (Cost: ${autoClickerCost})`;
      autoCountDisplay.textContent = `Owned: ${autoClickers}`;
      buyAutoBtn.disabled = score < autoClickerCost;

      // Grandma UI
      buyGrandmaBtn.textContent = `Grandma Baker (Cost: ${grandmaCost})`;
      grandmaCountDisplay.textContent = `Owned: ${grandmas}`;
      buyGrandmaBtn.disabled = score < grandmaCost;
    }

    // --- INTERACTION LOGIC ---
    
    // Main big button click
    clickBtn.addEventListener('click', () => {
      score += clickPower;
      updateUI();
    });

    // Buy Click Power
    buyClickBtn.addEventListener('click', () => {
      if (score >= clickUpgradeCost) {
        score -= clickUpgradeCost;
        clickPower += 1;
        clickUpgradeLevel += 1;
        clickUpgradeCost = Math.round(clickUpgradeCost * 1.25);
        updateUI();
      }
    });

    // Buy Auto-Clicker
    buyAutoBtn.addEventListener('click', () => {
      if (score >= autoClickerCost) {
        score -= autoClickerCost;
        autoClickers += 1;
        autoClickerCost = Math.round(autoClickerCost * 1.15);
        updateUI();
      }
    });

    // Buy Grandma
    buyGrandmaBtn.addEventListener('click', () => {
      if (score >= grandmaCost) {
        score -= grandmaCost;
        grandmas += 1;
        grandmaCost = Math.round(grandmaCost * 1.2);
        updateUI();
      }
    });

    // --- GAME LOOP ---
    // Runs 10 times a second (every 100ms) for smoother screen updates
    setInterval(() => {
      const passiveIncome = (autoClickers + (grandmas * 8)) / 10;
      score += passiveIncome;
      updateUI();
    }, 1000);

    // Run once at start
    updateUI();
  </script>

</body>
</body>
